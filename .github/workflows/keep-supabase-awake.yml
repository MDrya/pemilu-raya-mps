# Supabase's free plan pauses a project after 7 days without activity.
# This reads the public turnout row once a day so the project stays awake.
# Needs repository secrets SUPABASE_URL and SUPABASE_ANON_KEY (the public anon key).
name: Keep Supabase awake

on:
  schedule:
    - cron: '0 2 * * *' # daily, 09:00 WIB
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read public turnout
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --fail --silent --show-error \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/public_turnout?select=status,voted_count"
